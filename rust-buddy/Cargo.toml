[package]
name = "rust-buddy"
version = "0.1.0"
edition = "2021"

[dependencies]
gtk4 = "0.9"
gdk4 = "0.9"
gdk-pixbuf = "0.20"
glib = "0.20"
serde_json = "1.0"
serde = { version = "1", features = ["derive"] }
nix = { version = "0.29", features = ["user"] }
cairo-rs = "0.20"
evdev = "0.13"
whisper-rs = { version = "0.16", features = ["vulkan"] }
cpal = "0.18"
