[package]
name = "squeaky-agent"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "squeaky-agent"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "gzip", "rustls-tls"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
scraper = "0.20"
percent-encoding = "2"
